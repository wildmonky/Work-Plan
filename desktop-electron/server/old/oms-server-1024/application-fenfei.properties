#后台应用的端口
server.port=8181

#后台应用的根目录地址
server.servlet.context-path=/oms/omsserver

# ===================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1024MB


spring.session.timeout=3600

#数据库配置相关信息
spring.datasource.username=OMS_ZF
spring.datasource.password=oms#12345
spring.datasource.url=jdbc:dm://www.fenfei.cc:5236

#数据库驱动类名,达梦为dm.jdbc.driver.DmDriver,严格区分大小写
spring.datasource.driver-class-name=dm.jdbc.driver.DmDriver

spring.datasource.auto-commit=1
spring.datasource.min-conn=1
spring.datasource.max-conn=100
spring.datasource.init-conn=10

# ===================================

jodconverter.enabled=true
jodconverter.port-numbers=8100
jodconverter.max-tasks-per-process=10
# ===================================
# openOffice
# ===================================
# 默认不开启 需要开启的设置成true
jodconverter.local.enabled=false

# 开启多个openOffice进程，每个端口对应一个进程
jodconverter.local.portNumbers=8100
# openOffice进程重启前的最大进程数
jodconverter.local.maxTasksPerProcess=100

# ===================================

logging.level.root=debug
#日志文件输出路径,执行jar的用户必须有可写权限


logging.pattern.console=%d{yyyy-MM-dd hh:mm:ss} [%thread] %-5level %logger{50} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd} === [%thread] === %-5level === %logger{50} === - %msg%n

