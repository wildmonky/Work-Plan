spring:
    config:
        activate:
            on-profile: prod
    task:
        scheduling:
            pool:
                size: 3
    flyway:
        enabled: true
        user: sa
        password: sa
        encoding: UTF-8
#        batch: false # 8.0.5 社区版不支持配置batch
        create-schemas: true
        schemas:
            - OMS_ZF
        default-schema: OMS_ZF # default-schema 必须在 schemas中包含
        table: flyway_schema_history
        # 第一次迁移时，在非空的schema(即已经存在数据表结构的数据库中，应用flyway)，是否创建基线
        baseline-on-migrate: true
        # 当在非空schema中创建基线时，对应的基线版本
        baseline-version: 1
#        target: 1
        validate-on-migrate: true
        validate-migration-naming: false
        locations:
            - classpath:db/migration
    datasource:
        embedded-database-connection: h2
        hikari:
            driver-class-name: org.h2.Driver
            # jdbc:h2:mem:dbtest 内存模式.每次启动都要初始化
            # jdbc:h2:file:${user.dir}/db/test 文件模式
            jdbc-url: jdbc:h2:file:${user.dir}/db/test
            schema: OMS_ZF
            username: sa
            password: sa
            maximum-pool-size: 3
        dynamic:
            datasource:
                master:
                    auto-commit: 1
                    driver-class-name: org.h2.Driver
                    url: jdbc:h2:file:${user.dir}/db/test;schema=OMS_ZF
                    username: sa
                    password: sa
                    max-conn: 3

