		/* 文字提示 */

			max-width: 120px;
			display: block;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.tooltip.show {
			opacity: 1;
		}

		.bs-tooltip-top .arrow::before,

			border-top-color: rgba(250, 250, 250, .9);
		}

		.bs-tooltip-right .arrow::before,
		.bs-tooltip-auto[x-placement^=right] .arrow::before {
			border-right-color: rgba(250, 250, 250, .9);
		}

		.bs-tooltip-bottom .arrow::before,
		.bs-tooltip-auto[x-placement^=bottom] .arrow::before {

		}

		.bs-tooltip-left .arrow::before,

		.tooltip-inner {

			background-color: rgba(250, 250, 250, .9);

		#operationVerifyModal {
			.modal {
				position: relative;
				width: 100%;
				max-width: 500px;
				z-index: 10;
			}

			.modal-dialog {
				width: 100%;
			}

			.modal-content {
				background: white;
				border-radius: 16px;
				overflow: hidden;
				box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
				position: relative;
			}

			.modal-header {
				background: linear-gradient(90deg, #3498db, #2c3e50);
				color: white;
				padding: 20px;
				text-align: center;
				position: relative;
			}

			.modal-header h3 {
				font-weight: 600;
				font-size: 1.5rem;
				letter-spacing: 1px;
			}

			.modal-header::after {
				content: '';
				position: absolute;
				bottom: 0;
				left: 5%;
				width: 90%;
				height: 2px;
				background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
			}

			.modal-body {
				padding: 30px;
			}

			.verify-title {
				text-align: center;
				margin-bottom: 25px;
				color: #2c3e50;
			}

			.verify-title i {
				color: #3498db;
				margin-right: 10px;
			}

			.security-container {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 25px;
				background: #f8f9fa;
				border-radius: 12px;
				padding: 15px;
				box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
			}

			.security-code {
				flex: 1;
				height: 60px;
				background: linear-gradient(45deg, #e0e0e0, #f5f5f5);
				border-radius: 8px;
				display: flex;
				justify-content: center;
				align-items: center;
				font-size: 2rem;
				font-weight: bold;
				letter-spacing: 5px;
				color: #2c3e50;
				text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.1);
				position: relative;
				overflow: hidden;
			}

			.security-code::before {
				content: '';
				position: absolute;
				top: -50%;
				left: -50%;
				width: 200%;
				height: 200%;
				background: linear-gradient(45deg, transparent 33%, rgba(255, 255, 255, 0.3) 50%, transparent 66%);
				background-size: 10px 10px;
				animation: shine 3s infinite linear;
				transform: rotate(20deg);
			}

			@keyframes shine {
				0% {
					transform: translateX(-50%) rotate(20deg);
				}

				100% {
					transform: translateX(50%) rotate(20deg);
				}
			}

			.refresh-btn {
				background: #3498db;
				color: white;
				border: none;
				border-radius: 8px;
				padding: 12px 15px;
				margin-left: 15px;
				cursor: pointer;
				transition: all 0.3s ease;
				display: flex;
				align-items: center;
				font-weight: 500;
				box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3);
			}

			.refresh-btn:hover {
				background: #2980b9;
				transform: translateY(-2px);
				box-shadow: 0 6px 8px rgba(52, 152, 219, 0.4);
			}

			.refresh-btn:active {
				transform: translateY(0);
				box-shadow: 0 2px 4px rgba(52, 152, 219, 0.3);
			}

			.refresh-btn i {
				margin-right: 8px;
			}

			.input-group {
				margin-bottom: 30px;
				position: relative;
			}

			.input-group label {
				display: block;
				margin-bottom: 8px;
				color: #2c3e50;
				font-weight: 500;
				padding-left: 5px;
			}

			.input-field {
				width: 100%;
				padding: 15px 20px;
				border: 2px solid #e0e0e0;
				border-radius: 12px;
				font-size: 1rem;
				transition: all 0.3s ease;
				background: #f8f9fa;
				color: #2c3e50;
			}

			.input-field:focus {
				outline: none;
				border-color: #3498db;
				background: white;
				box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
			}

			.input-field::placeholder {
				color: #95a5a6;
			}

			.submit-btn {
				width: 100%;
				padding: 16px;
				background: linear-gradient(90deg, #3498db, #2c3e50);
				color: white;
				border: none;
				border-radius: 12px;
				font-size: 1.1rem;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.3s ease;
				letter-spacing: 1px;
				box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
			}

			.submit-btn:hover {
				transform: translateY(-3px);
				box-shadow: 0 8px 20px rgba(52, 152, 219, 0.6);
			}

			.submit-btn:active {
				transform: translateY(0);
				box-shadow: 0 4px 10px rgba(52, 152, 219, 0.4);
			}

			.hint-text {
				text-align: center;
				margin-top: 20px;
				color: #7f8c8d;
				font-size: 0.9rem;
			}

			.hint-text a {
				color: #3498db;
				text-decoration: none;
			}

			.hint-text a:hover {
				text-decoration: underline;
			}

			.decoration {
				position: absolute;
				width: 200px;
				height: 200px;
				background: linear-gradient(45deg, rgba(255, 255, 255, 0.1), transparent);
				border-radius: 50%;
			}

			.dec-1 {
				top: -80px;
				left: -80px;
			}

			.dec-2 {
				bottom: -100px;
				right: -80px;
			}

			/* 响应式设计 */
			@media (max-width: 576px) {
				.modal-body {
					padding: 20px;
				}

				.security-container {
					flex-direction: column;
				}

				.security-code {
					width: 100%;
					margin-bottom: 15px;
				}

				.refresh-btn {
					width: 100%;
					margin-left: 0;
					justify-content: center;
				}
			}
		}

		/* 针对头部多选 */
		.bootstrap-select.form-control .dropdown-menu.show {
			z-index: 1021;
		}

		.layui-menu {
			padding-left: 0;
		}

		/* 已归档菜单：整行可点击覆盖层 */
		.layui-menu li .menu-full-link {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			z-index: 2;
			display: block;
			margin: 0;
			padding: 0;
		}

		.layui-menu li .menu-full-link:hover {
			background: rgba(255, 255, 255, 0.1);
		}

		.d-vertical {
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.w-span {
			width: 148px;
			text-align: right;
		}
	</style>
</head>

<body onload="setTimeout(&#39;jsCommon.lockPage()&#39;,1000*3600);">

		function exportData(obj) {
			var opts = {
				lines: 13,// loading小块的数量

				width: 4, // 小块的宽度
				radius: 10, // 整个圆形的半径

				rotate: 0, // loading动画的旋转度数，貌似没什么实际作用
				color: '#000', // 颜色
				speed: 1,// 变换速度
				trail: 60,// 余晖的百分比
				shadow: true,// 是否渲染出阴影
			};

			let spinner = new Spinner(opts);

			let instance = axios.create({
				baseURL: _sys_baseurl,
				timeout: 240000,
				responseEncoding: 'utf-8',
				adapter: 'fetch'
			});
			// 响应拦截， 未登录跳转
			instance.interceptors.response.use(function (response) {
				let errorCode = response.data['err_code']
				debugger
				if (errorCode == '300099') {
					//重新登录;
					var url_login = "./login.html?err_code=" + errorCode;
					if (window.parent.parent) {
						window.parent.parent.location = url_login;
					} else if (window.parent) {
						window.parent.location = url_login;
					} else {
						window.location = url_login;
					}
				}

				let errorMsg = response.data['err_msg'];
				if (errorMsg) {
					alert(errorMsg);
				}
				return response;
			}, function (error) {
				return Promise.reject(error);
			})


			spinner.spin($('body')[0]);
			let data = $(obj.form).find('input#ymd').val()

			let formData = new FormData();
			formData.append('dataName', 'OMS_BUSBAR');
			formData.append('date', data);

			instance.post('/Data/Export', formData, { responseType: 'blob' }).then(response => {
				if (response.headers['content-type'] === 'application/json') {
					let messageBlob = new Blob([response.data], { type: 'application/json' });
					let fileReader = new FileReader();
					fileReader.readAsText(messageBlob);
					fileReader.onload = function (event) {
						let messageStr = fileReader.result;
						let message = JSON.parse(messageStr)
						alert(message["err_msg"]);
						//重新登录;
						var url_login = "../../../login.html?err_code=" + message["err_code"];
						if (window.parent.parent) {
							window.parent.parent.location = url_login;
						} else if (window.parent) {
							window.parent.location = url_login;
						} else {
							window.location = url_login;
						}
					};
				} else {
					// 下载文件
					let content = response.headers['content-disposition'];
					let filename = content.substring(content.indexOf('filename=') + 9);
					filename = decodeURIComponent(filename);
					var downloadUrl = URL.createObjectURL(response.data);
					var a = document.createElement('a');
					a.href = downloadUrl;
					a.download = filename;
					a.click();
					URL.revokeObjectURL(downloadUrl); // 释放掉blob URL对象
				}
			})
				.catch(err => console.log(err))
				.finally(() => {
					spinner.stop();
					$('button').removeAttr('disabled');
				});

		}

		function changeVerifyCode(length) {
			let code = '';
			for (let i = 0; i < length; i++) {
				const r = Math.floor(Math.random() * 36);
				if (r < 10) {
					code += r;
				} else {
					code += String.fromCharCode(r - 10 + 65);
				}
			}
			const securityCode = document.querySelector('.security-code');
			securityCode.value = code;
			// 添加刷新动画
			securityCode.style.opacity = '0';
			securityCode.style.transform = 'scale(0.8)';

			setTimeout(() => {
				securityCode.textContent = code;
				securityCode.style.opacity = '1';
				securityCode.style.transform = 'scale(1)';
			}, 300);
			verifyCode = code;
		}

		function checkInputVerifyCode(verifyCode, inputCode) {
			if (verifyCode === inputCode) {
				return Promise.resolve(true);
			} else {
				return Promise.reject(false);
			}
		}
