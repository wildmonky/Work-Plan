	<body>

				<div class="card-body p-1">
					<div>
						<div style="z-index:200;width: 480px;position: absolute;left: calc(50% - 240px);top: 10px;">
							<label for="date">日期(选择日期后再进行操作)：</label>
							<input id="date" type="week" ref="date" class="form-control" style="width: 200px;display: inline-block;"  name="日期" @change="searchByDate"/> 
                            <button class="btn btn-primary ml-1" @click="searchByDate('risk_alarm');searchByDate('week_risk')">刷新</button>
                        </div>
                        <div style="display: flex;">

                                <div style="position: relative; height: 200px;">

                                    </div>
                                </div>
                                <!--展示已上传文件--->
                                <div class="table-responsive tb-scrollbar" style="display: flex;" id="scrollable">
                                    <table class="table table-bordered table-striped table-nowrap mb-0 col-table" id="data-table" >
                                        <thead class="sticky-top sticky">
                                            <tr>			
                                                <!-- <th class="col-sticky">
                                                    <label for="poroductseall" class="mb-0">
                                                        <input type="checkbox" class="form-check-input position-static" id="chk_selall" onclick="checkAllRows(this.checked);"> 序号
                                                    </label>
                                                </th> -->
                                            
                                                <th nowrap="" class="col-sticky">

                                                </th>
        
                                                <th nowrap="" class="col-sticky">
                                                    <span>已上传文件</span>
                                                </th>
        
                                                <th nowrap="" class="col-sticky">

                                                </th>
                                            </tr>
                                        </thead>
                                            
                                        <tbody>
                                            <tr v-for="(row, index) of tableData">

                                                </td>             
                                            </tr>
                                        </tbody>
                                    </table>

                            </div>
                            <div style="width: 50%;padding: 20px;">
                                <div style="position: relative; height: 200px;">
                                    <div style="width: 410px;height: 100px;position:absolute;top: calc(50% - 40px); left: calc(50% - 205px);">
                                        <input type="file" ref="week_risk" @change="uploadFiles('week_risk')" class="custom-file-input" accept=".docx" name="uploadfile" id="uploadfile" lang="zh-CN">
                                        <label class="custom-file-label" for="uploadfile">电网主要检修及电网运行风险预警及重载设备清单</label>
                                    </div>
                                </div>
                                <!--展示已上传文件--->

                                    <table class="table table-bordered table-striped table-nowrap mb-0 col-table" id="data-table" >
                                        <thead class="sticky-top sticky">

                                                    </label>
                                                </th> -->
                                            
                                                <th nowrap="" class="col-sticky">

                                                </th>

                                        </thead>

                                            <tr v-for="(row, index) of tableData1">

                                                <td>
                                                    <span>{{row.substring(10)}}</span>

	<script src="../js/simplebar.js"></script>
    <script type="text/javascript">

		new Vue({
			el: "#app",
			data() {
				return {
					spinner: {},
					instance: {},
					date: '111',
					checkFiles: [],
					tableData: [],
					tableData1: [],
					filenames: [
						{
							type: "tomorrowWorkPlan",
                            name: "生成的计划.xlsx",
							isCreate: true
						},
						{
							type: "message",
							name: "生成的重要信息.txt",
							isCreate: true
						},
						{
							type: "export",
							name: "生成的图片.png",
							isCreate: true
						},
						{ 
							type: "check",
							name: "管控、非管控文件"
						},
						{
							type: "master",
                            name: "主调文件.xlsx"
						},
						{
							type: "sub",
                            name: "配调文件.xlsx"
						},
                        {
                            type: "week_risk",
                            name: "电网主要检修及电网运行风险预警及重载设备清单.docx"
                        },
						{
							type: "risk_alarm",
                            name: "系统运行专业作业计划周管控会汇报材料.docx"
						},
						{
							type: "data",
							name: "计划管控excel.xlsx"
						}
					]
				};
			},
			created() {
				var opts = {
					lines:13,// loading小块的数量
					length: 7, // 小块的长度
					width: 4, // 小块的宽度
					radius: 10, // 整个圆形的半径
					corners: 1, // 小块的圆角，越大则越圆
					rotate: 0, // loading动画的旋转度数，貌似没什么实际作用
					color: '#000', // 颜色
					speed: 1,// 变换速度
					trail: 60,// 余晖的百分比
					shadow: true,// 是否渲染出阴影
            	};

				this.spinner = new Spinner(opts);

				this.instance = axios.create({
						baseURL: _sys_baseurl,
						timeout: 10000,
                        adapter: 'fetch'
				});
                // 响应拦截， 未登录跳转
                this.instance.interceptors.response.use(function(response) {
                    let errorCode = response.data['err_code']
                    if (errorCode == '300099') {
                        //重新登录;
                        var url_login="../../../login.html?err_code=" + errorCode;
                        if (window.parent.parent){
                            window.parent.parent.location=url_login;
                        }else if (window.parent){
                            window.parent.location=url_login;
                        }else{
                            window.location=url_login;
                        }
                    }
					let errorMsg = response.data['err_msg'];
					if (errorMsg) {
						alert(errorMsg);
					}
                    return response;
                }, function(error) {
                    return Promise.reject(error);
                })
			},
			mounted() {
                let now = moment();
                this.date = now.format('YYYY-MM-DD');
                this.$refs['date'].value = now.year() + '-W' + now.week();
				this.searchByDate('risk_alarm');
                this.searchByDate('week_risk');
			},
			methods: {
				searchByDate(type) {
					date = this.$refs['date'].valueAsDate;
                    if (!date) {
                        alert('请选择日期');
                        return;
                    }
                    this.date = moment(date).format('YYYY-MM-DD');
					this.spinner.spin($('body')[0]);
					this.tableData = [];
					this.tableData1 = [];
					this.instance.get("/work/plan/date/files?type=" + type + "&date=" + this.date).then(result => {
                        if(type == 'risk_alarm') {
                            this.tableData = result.data;
                        } else {
                            this.tableData1 = result.data;
                        }
					}).catch(err => {
						console.log(err);
					}).finally(_ => {
						this.spinner.stop();
					})
				},
				uploadFiles(type) {
					let files = this.$refs[type].files;
					let formData = new FormData();

					formData.append("type", type);
					formData.append("date", moment(this.$refs['date'].valueAsDate).format('YYYY-MM-DD'));
					for (const file of files) {
						formData.append("files", file);
					}

					this.spinner.spin($('body')[0]);
					this.instance.post('/work/plan', formData)
                    .then(response => {
                    })
                    .catch(err => console.log(err))
                    .finally(_ => {
						this.searchByDate('risk_alarm');
                        this.searchByDate('week_risk');
						this.$refs[type].value = '';
                        this.spinner.stop();
                    });
				},
				download(filename) {
					$('button').attr('disabled', 'disabled'); 
					this.spinner.spin($('body')[0]);
					this.instance.get('/work/plan/download/' + this.date + '/' + filename, { responseType: 'blob' })
					.then(response => {
                        if (response.headers['content-type'] === 'application/json') {
							let messageBlob = new Blob([response.data], {type: 'application/json'});
							let fileReader = new FileReader();
							fileReader.readAsText(messageBlob);
							fileReader.onload = function(event) {
								let messageStr = fileReader.result;
								let message = JSON.parse(messageStr)
								alert(message["err_msg"]);
								//重新登录;
								var url_login="../../../login.html?err_code=" + message["err_code"];
								if (window.parent.parent){
									window.parent.parent.location=url_login;
								}else if (window.parent){
									window.parent.location=url_login;
								}else{
									window.location=url_login;
								}
							};
						} else {
                            // 下载文件
                            let content = response.headers['content-disposition'];
                            let filename = content.substring(content.indexOf('filename=') + 9);
                            var blob = new Blob([response.data],  { type: "application/octet-stream;charset=ISO8859-1"});
                            var downloadUrl = URL.createObjectURL(blob);
                            var a = document.createElement('a');
                            a.href = downloadUrl;
                            a.download = this.filenames.filter(e => filename.startsWith(e.type))[0]?.name;
                            a.click();
                            URL.revokeObjectURL(downloadUrl); // 释放掉blob URL对象
                        }    
					})
					.catch(err => console.log(err))
					.finally(() => {
					    this.spinner.stop();
					    $('button').removeAttr('disabled');
					});
				}
			}
		})
	</script>
	
</body>
