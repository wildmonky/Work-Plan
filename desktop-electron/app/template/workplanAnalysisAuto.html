		<style>
			.main-body{
				display: flex;
				flex-direction: column;
				min-height: calc(100vh - 1rem);
				min-width: 0;
				transition: margin-left 0.35s ease-in-out, left 0.35s ease-in-out, margin-right 0.35s ease-in-out, right 0.35s ease-in-out;
				width: 100%;
			}
			.table-responsive{
				display: inherit;
				width: 100%;
				max-height: calc(100vh - 280px);
				overflow: auto;
			}
			.card .table-bordered tr td.textwrap > span{
				text-wrap: wrap;
				word-wrap: break-word;
				word-break: break-all;
				white-space: pre-wrap;
			}
			.card .table-bordered tr td:last-child.textwrap > span{
				white-space: nowrap;
			}
		</style>
	</head>
	<body>
	<div class="container-fluid mt-3 d-flex" id="app">
		<div class="main-body">
			<div class="card">
				<div class="card-header">
					<h3 class="text-center mb-0 flex-grow-1">
						电网管理平台工作计划统计--(自动获取日作业计划数据)
					</h3>
				</div>
				<div class="card-header bg-light">
					<div class="w-25 m-auto d-flex justify-content-start align-items-center">
						<label for="date" class="flex-shrink-0 mb-0">日期(选择日期后再进行操作)：</label>
						<input id="date" type="date" ref="date" class="form-control mr-3" name="日期" :value="date" @change="searchByDate"/> 
						<button class="btn btn-primary flex-shrink-0" @click="searchByDate(null)" >刷新</button>
					</div>
				</div>
				<div class="card-body">
					<div class="row">
						<div class="col-6 d-flex flex-column justify-content-center align-items-end">
							<div class="custom-file w-50 mb-3">
								<input type="file" ref="master" @change="uploadFiles('master')" class="custom-file-input" accept=".xlsx,.xlsm" name="uploadfile" id="uploadfile" lang="zh-CN">
								<label class="custom-file-label" for="uploadfile">主调文件上传</label>
							</div>
							<div class="custom-file w-50 mb-3">
								<input type="file" ref="sub" @change="uploadFiles('sub')" class="custom-file-input" accept=".xlsx,.xlsm" name="uploadfile" id="uploadfile" lang="zh-CN">
								<label class="custom-file-label" for="uploadfile">配调文件上传</label>
							</div>
							<div class="custom-file w-50 mb-3">
								<input ref="cellColumnName" class="form-control bg-white" placeholder="二次打印最后一列名称，注意：填写会修改，默认不填" name="lastColumnName" id="lastColumnName" lang="zh-CN">
							</div>
						</div>
						<div class="col-6 d-flex flex-column justify-content-center align-items-start">
							<!-- <div class="custom-file w-50 mb-3">
								<input type="file" multiple ref="check" @change="uploadFiles('check')" class="custom-file-input" accept=".xlsx,.xlsm" name="uploadfile" id="uploadfile" lang="zh-CN">
								<label class="custom-file-label" for="uploadfile">调度类二次作业文件上传</label>
							</div>
							<div class="custom-file w-50 mb-3">
								<input type="file" multiple ref="extraCheck" @change="uploadFiles('extraCheck')" class="custom-file-input" accept=".xlsx,.xlsm" name="uploadfile" id="uploadfile" lang="zh-CN">
								<label class="custom-file-label" for="uploadfile">非调度类二次作业文件上传</label>
							</div> -->
							<div class="custom-file w-50 mb-3 h-100">
								<button type="button" @click="analysis()" class="w-100 h-100 btn btn-primary d-block">生成文件</button>
							</div>
						</div>
					</div>
				</div>
				<div class="row">
					<div class="col-6">
						<div class="table-responsive">
							<table class="table table-bordered table-striped table-nowrap mb-0 col-table">
								<thead class="sticky-top sticky">
									<tr>			
										<th class="col-sticky">
											<label for="poroductseall" class="mb-0">
												<input type="checkbox" class="form-check-input position-static" id="chk_selall" onclick="checkAllRows(this.checked);"> 序号
											</label>
										</th>
									
										<th nowrap="" class="col-sticky">
											<span>已上传文件</span>
										</th>
													
										<th nowrap="" class="col-sticky">
											<span>操作</span>
										</th>
									</tr>
								</thead>
									
								<tbody>
									<tr v-for="(row, index) of tableData">
										<!-- <td><span>{{ (page.current -1 ) * page.size + rowindex + 1 }}</span></td> -->
										<td class="col-sticky">
											<span>{{index + 1}}</span>
										</td>
										<td>
											<span>{{filenames.filter(e => row.startsWith(e.type))[0]?.name}}</span>
										</td>
										<td>
											<button class="btn btn-primary" @click="download(row)">下载</button>
											<button class="btn btn-danger" @click="remove(row, 'remove')">删除</button>
										</td>             
									</tr>
								</tbody>
							</table>
						</div>
					</div>
					<div class="col-6">
						<div class="table-responsive">
							<table class="table table-bordered table-striped table-nowrap mb-0 col-table">
								<thead class="sticky-top sticky">
									<tr>			
										<th class="col-sticky">
											<label for="poroductseall" class="mb-0">
												<input type="checkbox" class="form-check-input position-static" id="chk_selall" onclick="checkAllRows(this.checked);"> 序号
											</label>
										</th>
									
										<th nowrap="" class="col-sticky">
											<span>生成文件</span>
										</th>
													
										<th nowrap="" class="col-sticky">
											<span>操作</span>
										</th>
									</tr>
								</thead>
									
								<tbody>
									<tr v-for="(row, index) of tableData1">
										<!-- <td><span>{{ (page.current -1 ) * page.size + rowindex + 1 }}</span></td> -->
										<td class="col-sticky">
											<span>{{index + 1}}</span>
										</td>
										<td>
											<span>{{filenames.filter(e => row.startsWith(e.type))[0]?.name}}</span>
										</td>
										<td>
											<button class="btn btn-primary" @click="download(row)">下载</button>
											<button class="btn btn-danger" @click="remove(row, 'remove')">删除</button>
										</td>             
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
				<div class="card-body p-1">
					<div class="table-responsive tb-scrollbar" style="display: flex;" id="scrollable">
						<div style="width: 50%;padding: 10px;">
							
						</div>
						<div style="width: 50%;padding: 10px;">
							
						</div>
						
					</div>
					

				</div>
			</div>
		</div>
	</div>
					
	<script src="../js/simplebar.js"></script>
    <script type="text/javascript">

		new Vue({
			el: "#app",
			data() {
				return {
					spinner: {},
					instance: {},
					date: new Date().toLocaleDateString().replaceAll("/", "-"),
					checkFiles: [],
					tableData: [],
					tableData1: [],
					filenames: [
						{
							type: "export_tomorrow",
                            name: "调控中心作业计划（主调、配调、二次）.xlsx",
							isCreate: true
						},
						{
							type: "message",
							name: "生成的重要信息.txt",
							isCreate: true
						},
						{
							type: "export_img",
							name: "调控中心作业计划风险管控.png",
							isCreate: true
						},
						{ 
							type: "check",
							name: "调度类二次作业文件（自动生成）.xlsx"
						},
						{ 
							type: "extraCheck",
							name: "非调度类二次作业文件（自动生成）.xlsx"
						},
						{
							type: "master",
                            name: "主调文件.xlsx"
						},
						{
							type: "sub",
                            name: "配调文件.xlsx"
						},
						// {
						// 	type: "risk_alarm",
                        //     name: "系统运行专业作业计划周管控会汇报材料.docx"
						// },
						{
							type: "data",
							name: "计划管控excel.xlsm"
						}
					]
				};
			},
			created() {
				var opts = {
					// lines:13,// loading小块的数量
					length: 28, // 小块的长度
					width: 14, // 小块的宽度
					radius: 42, // 整个圆形的半径
					corners: 1, // 小块的圆角，越大则越圆
					rotate: 0, // loading动画的旋转度数，貌似没什么实际作用
					color: '#fff', // 颜色
					scale: 0.5,
					opacity: 0.2,
					speed: 1,// 变换速度
					trail: 60,// 余晖的百分比
            	};

				this.spinner = new Spinner(opts);

				this.instance = axios.create({
						baseURL: _sys_baseurl,
						timeout: 240000,
						adapter: 'fetch'
				});
				// 响应拦截， 未登录跳转
                this.instance.interceptors.response.use(function(response) {
					let errorCode = response.data['err_code']
                    if (errorCode == '300099') {
                        //重新登录;
                        var url_login="../../../login.html?err_code=" + errorCode;
                        if (window.parent.parent){
                            window.parent.parent.location=url_login;
                        }else if (window.parent){
                            window.parent.location=url_login;
                        }else{
                            window.location=url_login;
                        }
                    }

					let errorMsg = response.data['err_msg'];
					if (errorMsg) {
						jsCommon.alert(errorMsg);
					}
                    return response;
                }, function(error) {
                    return Promise.reject(error);
                })
			},
			mounted() {
				this.searchByDate();
			},
			methods: {
				searchByDate(date) {
					this.date = date ? date.target.value : this.date;
					this.spinner.spin($('body')[0]);
					this.tableData = [];
					this.tableData1 = [];
					this.instance.get("/work/plan/date/files?isAuto=1&type=&date=" + this.date).then(result => {
						// 排序
						for (const e of result.data) {
							let data = this.filenames.filter(d => e.startsWith(d.type))[0];
							if (data) {
								data.isCreate ? this.tableData1.push(e) : this.tableData.push(e);
                            }
						}
					}).catch(err => {
						console.log(err);
					}).finally(_ => {
						this.spinner.stop();
					})
				},
				uploadFiles(type) {
					let files = this.$refs[type].files;
					let formData = new FormData();

					formData.append("type", type);
					formData.append("date", this.date);
					for (const file of files) {
						formData.append("files", file);
					}

					this.spinner.spin($('body')[0]);
					this.instance.post('/work/plan', formData)
                    .then(response => {
                    })
                    .catch(err => alert(err))
                    .finally(_ => {
						this.$refs[type].value = ''
						this.searchByDate();
                        this.spinner.stop();
                    });

				},
				analysis() {
					$('button').attr('disabled', 'disabled'); 
					this.spinner.spin($('body')[0]);
					this.instance.get('/work/plan/auto/analysis/' + this.date,{
						params: {
							"cellColumnName": this.$refs['cellColumnName'].value
						}
					}).finally(() => {
						$('button').removeAttr('disabled'); 
                        this.spinner.stop();
						this.searchByDate()
					});
				},
				download(filename) {
					$('button').attr('disabled', 'disabled'); 
					this.spinner.spin($('body')[0]);
					this.instance.get('/work/plan/download/' + this.date + '/' + filename + '?isAuto=1', { responseType: 'blob' })
					.then(response => {
						if (response.headers['content-type'] === 'application/json') {
							let messageBlob = new Blob([response.data], {type: 'application/json'});
							let fileReader = new FileReader();
							fileReader.readAsText(messageBlob);
							fileReader.onload = function(event) {
								let messageStr = fileReader.result;
								let message = JSON.parse(messageStr)
								alert(message["err_msg"]);
								//重新登录;
								var url_login="../../../login.html?err_code=" + message["err_code"];
								if (window.parent.parent){
									window.parent.parent.location=url_login;
								}else if (window.parent){
									window.parent.location=url_login;
								}else{
									window.location=url_login;
								}
							};
						} else {
							// 下载文件
							let content = response.headers['content-disposition'];
							let filename = content.substring(content.indexOf('filename=') + 9);
							var blob = new Blob([response.data],  { type: "application/octet-stream;charset=ISO8859-1"});
							var downloadUrl = URL.createObjectURL(blob);
							var a = document.createElement('a');
							a.href = downloadUrl;
							a.download = this.date.replace('-', '年').replace('-', '月') + '日' + this.filenames.filter(e => filename.startsWith(e.type))[0]?.name;
							a.click();
							URL.revokeObjectURL(downloadUrl); // 释放掉blob URL对象
					   }
			        })
					.catch(err => console.log(err))
					.finally(() => {
					    this.spinner.stop();
					    $('button').removeAttr('disabled');
					});
				},
				remove(filename) {
					$('button').attr('disabled', 'disabled'); 
					this.spinner.spin($('body')[0]);
					this.instance.get('/work/plan/auto/remove/' + this.date + '/' + filename)
					.then(response => {
					    alert("文件删除成功");
						this.searchByDate();
					})
					.catch(err => {
						console.log(err)
					})
					.finally(() => {
					    this.spinner.stop();
					    $('button').removeAttr('disabled');
					});
				}
			}
		})
	</script>
	
</body>
